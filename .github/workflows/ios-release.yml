# Build Paw Crossing on a macOS runner and ship it with fastlane.
#   iap      → create the 7 in-app purchases in App Store Connect
#   beta     → signed build to TestFlight
#   metadata → store listing, screenshots, age rating (no build)
#   release  → build, wait for processing, submit for App Review
# Secrets: see docs/SETUP-ACCOUNTS.en.md
name: iOS release

on:
  workflow_dispatch:
    inputs:
      lane:
        description: fastlane lane
        type: choice
        options: [iap, beta, metadata, release]
        default: beta

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  ship:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      REVIEW_FIRST_NAME: ${{ secrets.REVIEW_FIRST_NAME }}
      REVIEW_LAST_NAME: ${{ secrets.REVIEW_LAST_NAME }}
      REVIEW_PHONE: ${{ secrets.REVIEW_PHONE }}
      REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v"; missing=1; fi
          done
          exit $missing

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - run: npm ci

      - name: Typecheck and unit tests
        run: npx tsc --noEmit && npx jest

      - name: Install pods
        working-directory: ios
        run: bundle exec pod install

      - name: fastlane ${{ inputs.lane }}
        run: bundle exec fastlane ios ${{ inputs.lane }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            build/*.ipa
            ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
